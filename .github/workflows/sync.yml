name: Sync one accepted Fudge DESIGN.md guide

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Normalized domain, for example stripe.com
        required: false
        type: string
      share_key:
        description: Accepted Fudge share key
        required: false
        type: string
      backfill:
        description: Refresh all accepted domain DESIGN.md shares
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fudge-design-md-${{ inputs.backfill && 'backfill' || inputs.domain }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FUDGE_DOMAIN: ${{ inputs.domain }}
      FUDGE_SHARE_KEY: ${{ inputs.share_key }}
      FUDGE_BACKFILL: ${{ inputs.backfill && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download accepted guide
        run: node scripts/sync.mjs
      - name: Commit accepted guides
        run: |
          if git diff --quiet; then
            echo "No guide changes."
            exit 0
          fi
          git config user.name "fudge-design-md[bot]"
          git config user.email "fudge-design-md[bot]@users.noreply.github.com"
          if [ "${FUDGE_BACKFILL}" = "1" ]; then
            git add README.md design-md
            git commit -m "docs: backfill accepted design guides"
          else
            git add README.md "design-md/${FUDGE_DOMAIN}.md"
            git commit -m "docs: publish ${FUDGE_DOMAIN} design guide"
          fi
          git push
