name: Sync Fudge DESIGN.md guides

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fudge-design-md-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download current guides
        run: node scripts/sync.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No guide changes."
            exit 0
          fi
          git config user.name "fudge-design-md[bot]"
          git config user.email "fudge-design-md[bot]@users.noreply.github.com"
          git add README.md design-md
          git commit -m "chore: sync Fudge DESIGN.md guides"
          git push
